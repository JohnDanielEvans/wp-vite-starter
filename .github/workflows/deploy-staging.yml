name: Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  # Theme directory name on the server. Change this per project.
  THEME_SLUG: wp-vite-starter

jobs:
  # See the equivalent note in deploy-production.yml: this keeps a fresh fork
  # from emailing its owner a failed deploy they never set up.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: 🔍 Check deploy secrets are configured
        id: check
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging deploy secrets are not configured — skipping deploy. See the README for the required secrets."
          fi

  build-and-deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7

      - name: 💻 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📅 Install dependencies
        run: npm ci

      - name: 🧼 Lint styles
        run: npx stylelint "src/assets/**/*.{scss,css}" --allow-empty-input

      - name: 🏗 Build and package theme
        run: npm run build:prod

      - name: 🔑 Setup SSH key
        run: echo "$PRIVATE_KEY" | base64 --decode > ./deploy_key && chmod 600 ./deploy_key
        env:
          PRIVATE_KEY: ${{ secrets.STAGING_PRIVATE_KEY }}

      - name: 🧾 Pin the host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 🛠 Ensure remote theme folder exists
        run: |
          ssh -i ./deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} \
            "mkdir -p '${{ secrets.STAGING_SSH_PATH }}/wp-content/themes/$THEME_SLUG'"

      - name: 🚀 Deploy built theme to staging
        run: |
          rsync -rlvz --no-owner --no-group --no-perms --delete --no-times --omit-dir-times \
            -e 'ssh -i ./deploy_key' \
            "./deploy/$THEME_SLUG/" \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:${{ secrets.STAGING_SSH_PATH }}/wp-content/themes/$THEME_SLUG/

      - name: 🧹 Remove deploy key
        if: always()
        run: rm -f ./deploy_key
