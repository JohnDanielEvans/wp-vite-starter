name: Deploy to Production

on:
  push:
    branches:
      - prod-live

env:
  # Theme directory name on the server. Change this per project.
  THEME_SLUG: wp-vite-starter

jobs:
  # A fresh fork has no deploy secrets. Without this gate the deploy job runs,
  # fails on the first ssh, and mails the fork owner a red X for a workflow they
  # never configured. Checking one required secret is enough to tell "configured"
  # from "just forked" — secrets are not readable in a job-level `if`, so it has
  # to happen in a step.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: 🔍 Check deploy secrets are configured
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deploy secrets are not configured — skipping deploy. See the README for the required secrets."
          fi

  build-and-deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7

      - name: 💻 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📅 Install dependencies
        run: npm ci

      - name: 🧼 Lint styles
        run: npx stylelint "src/assets/**/*.{scss,css}" --allow-empty-input

      - name: 🏗 Build and package theme
        run: npm run build:prod

      - name: 🔑 Setup SSH key
        run: echo "$PRIVATE_KEY" | base64 --decode > ./deploy_key && chmod 600 ./deploy_key
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: 🧾 Pin the host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Managed WordPress hosts often leave the theme dir owned by the web user
      # (php-fpm, www-data) after a wp-admin plugin/theme update. The deploy
      # user then cannot write into it and has no sudo. Moving it aside is the
      # only recovery available without root; the next step recreates it.
      - name: 🔧 Reclaim theme dir if owned by another user (no sudo)
        run: |
          ssh -i ./deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            THEME="${{ secrets.SSH_PATH }}/wp-content/themes/'"$THEME_SLUG"'"
            if [ -e "$THEME" ] && [ ! -w "$THEME" ]; then
              echo "Theme dir not writable by $(whoami); moving aside and recreating"
              mv "$THEME" "${THEME}.old-$(date +%s)"
            fi
            mkdir -p "$THEME"
          '

      - name: 🔐 Fix permissions before rsync
        run: |
          ssh -i ./deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod -R u+w '${{ secrets.SSH_PATH }}/wp-content/themes/$THEME_SLUG' || true"

      - name: 🚀 Deploy built theme
        run: |
          rsync -rlvz --no-owner --no-group --no-perms --delete --no-times --omit-dir-times \
            -e 'ssh -i ./deploy_key' \
            "./deploy/$THEME_SLUG/" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}/wp-content/themes/$THEME_SLUG/

      # Opt-in: set repository variable SYNC_PLUGINS=true to enable.
      # Only meaningful if you actually vendor plugins into ./plugins and remove
      # it from .gitignore. Note there is no --delete here: a stray --delete
      # against wp-content/plugins would wipe every plugin installed via wp-admin.
      - name: 🚂 Sync vendored plugins
        if: vars.SYNC_PLUGINS == 'true'
        run: |
          if [ -d ./plugins ] && [ -n "$(ls -A ./plugins 2>/dev/null | grep -v '^\.gitkeep$')" ]; then
            rsync -rlvz --no-owner --no-group --no-perms \
              -e 'ssh -i ./deploy_key' \
              ./plugins/ \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}/wp-content/plugins/
          else
            echo "No vendored plugins to sync — skipping"
          fi

      - name: 🧹 Remove deploy key
        if: always()
        run: rm -f ./deploy_key
